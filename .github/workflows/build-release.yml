name: Build and release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build and test
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          .\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DropHound-Windows
          path: installer-output/DropHound-Setup-*.exe

  macos:
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and test
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: ./build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DropHound-macOS-${{ matrix.arch }}
          path: release/*.dmg

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install desktop build tools
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Build and test
        run: ./build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DropHound-Linux
          path: |
            release/*.deb
            release/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}" artifacts/*
          --repo "${GITHUB_REPOSITORY}"
          --generate-notes
          --verify-tag
